[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bootstrap-agent-sdk"
dynamic = ["version"]
description = "An agent SDK for config-driven chat agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Indunil Udayangana", email = "induniludayangana.18@cse.mrt.ac.lk" }]
keywords = ["agent", "llm", "langchain", "langgraph", "mcp", "chatbot", "ag-ui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langsmith>=0.1.100",
    "langchain-openai>=1.0",
    "langchain",
    "langchain-anthropic",
    "langchain-google-genai",
    "langchain-mcp-adapters>=0.3",
]

[project.urls]
Homepage = "https://github.com/indunil-19/bootstrap_agent_sdk"
Documentation = "https://github.com/indunil-19/bootstrap_agent_sdk#readme"
Issues = "https://github.com/indunil-19/bootstrap_agent_sdk/issues"
Changelog = "https://github.com/indunil-19/bootstrap_agent_sdk/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "bootstrap_agent.__version__" }

[tool.setuptools.packages.find]
include = ["bootstrap_agent*"]
